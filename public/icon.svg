<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="crispEdges">
  <rect width="512" height="512" fill="#14202b"/>
  <!-- chunky pixel football, tilted by stepping the rows -->
  <g fill="#b5653a">
    <rect x="288" y="112" width="64" height="32"/>
    <rect x="240" y="144" width="144" height="32"/>
    <rect x="208" y="176" width="192" height="32"/>
    <rect x="176" y="208" width="224" height="32"/>
    <rect x="144" y="240" width="240" height="32"/>
    <rect x="128" y="272" width="224" height="32"/>
    <rect x="112" y="304" width="208" height="32"/>
    <rect x="112" y="336" width="176" height="32"/>
    <rect x="128" y="368" width="112" height="32"/>
  </g>
  <!-- tip stripes -->
  <g fill="#f4efe1">
    <rect x="320" y="144" width="32" height="32"/>
    <rect x="144" y="336" width="32" height="32"/>
  </g>
  <!-- laces -->
  <g fill="#f4efe1">
    <rect x="192" y="272" width="96" height="16" transform="rotate(-40 240 280)"/>
    <rect x="216" y="232" width="16" height="32"/>
    <rect x="248" y="208" width="16" height="32"/>
    <rect x="280" y="184" width="16" height="32"/>
    <rect x="184" y="256" width="16" height="32"/>
  </g>
  <!-- yellow accent bar -->
  <rect x="96" y="432" width="320" height="24" fill="#ffd166"/>
</svg>
